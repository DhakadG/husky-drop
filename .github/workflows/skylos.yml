name: Skylos Analysis

# Pull requests only: the gate looks at the PR diff. A whole-repo run on main
# fails on a pre-existing backlog (61 innerHTML findings in admin/share code
# that is escaped through esc(), plus the same count every push), which trains
# everyone to ignore a red check.
"on":
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  skylos:
    name: Skylos Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Skylos
        run: python -m pip install skylos==4.37.0

      - name: Pull Skylos Cloud Policy
        run: |
          skylos sync pull || echo "No Skylos Cloud policy available through GitHub OIDC; continuing with local config."


      - name: Run Skylos Analysis
        run: |
          pr_base_ref="origin/${GITHUB_BASE_REF:-main}"
          skylos . --danger --quality --ai-defects --secrets --sca --baseline --diff-base "$pr_base_ref" --diff "$pr_base_ref" --json -o skylos-results.json

      - name: Quality Gate
        if: always()
        run: skylos cicd gate --input skylos-results.json --summary

      - name: GitHub Annotations
        if: always()
        run: skylos cicd annotate --input skylos-results.json

      - name: PR Review Comments
        if: github.event_name == 'pull_request' && always()
        run: |
          pr_base_ref="origin/${GITHUB_BASE_REF:-main}"
          skylos cicd review --input skylos-results.json --diff-base "$pr_base_ref" --evidence-cards
        env:
          GH_TOKEN: ${{ github.token }}
