# Whole-file and whole-surface review, run on demand.
#
# Not a diff review - CI, Skylos, opencode and CodeRabbit already cover diffs.
# This reads every source file end to end, and every feature surface as a
# whole, and writes the results to a branch as Markdown so they can be worked
# through offline.
name: Deep review

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: "file (every source file) | surface (every feature area) | both"
        type: choice
        options: [both, file, surface]
        default: both
      only:
        description: "comma-separated targets, e.g. src/share-index.js or admin-pipelines. Blank = everything."
        default: ""
      force:
        description: "re-review targets whose content has not changed"
        type: boolean
        default: false
      shards:
        description: "parallel shards for the file pass"
        default: "8"

permissions:
  contents: read

concurrency:
  group: deep-review
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          n=$(printf '%d' "${SHARDS:-8}" 2>/dev/null || echo 8)
          [ "$n" -ge 1 ] && [ "$n" -le 20 ] || n=8
          echo "shards=$(seq 0 $((n - 1)) | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  files:
    if: inputs.mode != 'surface'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # Previous results seed the manifest, so unchanged files are not re-paid for.
      - name: Fetch previous results
        run: git fetch origin reviews:reviews 2>/dev/null && git --work-tree=review-out checkout reviews -- . 2>/dev/null || echo "no previous review branch"
      - name: Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Dispatch inputs are attacker-influenced text: they reach the shell
          # as quoted environment values, never as expanded expressions.
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shards }}
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "::error::ANTHROPIC_API_KEY secret is not set"; exit 1; }
          set -- --mode file --shard "$SHARD" --shards "$SHARDS"
          [ -n "$ONLY" ] && set -- "$@" --only "$ONLY"
          [ "$FORCE" = "true" ] && set -- "$@" --force
          node scripts/review/run.mjs "$@"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-file-${{ matrix.shard }}
          path: review-out/

  surfaces:
    if: inputs.mode != 'file'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Fetch previous results
        run: git fetch origin reviews:reviews 2>/dev/null && git --work-tree=review-out checkout reviews -- . 2>/dev/null || echo "no previous review branch"
      - name: Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "::error::ANTHROPIC_API_KEY secret is not set"; exit 1; }
          set -- --mode surface
          [ -n "$ONLY" ] && set -- "$@" --only "$ONLY"
          [ "$FORCE" = "true" ] && set -- "$@" --force
          node scripts/review/run.mjs "$@"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-surface
          path: review-out/

  collect:
    if: always() && (needs.files.result == 'success' || needs.surfaces.result == 'success')
    needs: [files, surfaces]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: review-*
          merge-multiple: true
      - name: Render
        run: |
          mkdir -p review-out && cp -r artifacts/* review-out/ 2>/dev/null || true
          node scripts/review/render.mjs --out review-out
          cat review-out/INDEX.md >> "$GITHUB_STEP_SUMMARY"
      # An orphan branch, so reviews never touch main's history.
      - name: Publish to the reviews branch
        env:
          MODE: ${{ inputs.mode }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan reviews-tmp
          git rm -rq --cached . || true
          find . -maxdepth 1 ! -name review-out ! -name .git ! -name . -exec rm -rf {} +
          mv review-out/* . && rmdir review-out
          git add -A
          git commit -q -m "review: ${MODE} pass from ${SHA} (run ${RUN_ID})"
          git push -f origin reviews-tmp:reviews
          echo "Results: https://github.com/${REPO}/tree/reviews" >> "$GITHUB_STEP_SUMMARY"
