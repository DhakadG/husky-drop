<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">LostHusky Drop</title>
  <desc id="desc">A white water drop inside a blue and teal glass tile.</desc>
  <defs>
    <linearGradient id="tile" x1="48" y1="52" x2="458" y2="462" gradientUnits="userSpaceOnUse">
      <stop stop-color="#306CFF"/><stop offset=".48" stop-color="#338BF3"/><stop offset="1" stop-color="#18C5C9"/>
    </linearGradient>
    <linearGradient id="core" x1="208" y1="183" x2="308" y2="326" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2F6BFF"/><stop offset="1" stop-color="#18B9C9"/>
    </linearGradient>
    <linearGradient id="shine" x1="92" y1="72" x2="313" y2="334" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".48"/><stop offset=".55" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-20%" width="150%" height="165%">
