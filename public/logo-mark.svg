    <path d="M256 201c-17 25-50 61-50 94 0 31 22 52 50 52s50-21 50-52c0-33-33-69-50-94Z" fill="url(#core)"/>
    <ellipse cx="169" cy="118" rx="55" ry="25" transform="rotate(-32 169 118)" fill="#fff" opacity=".2"/>
